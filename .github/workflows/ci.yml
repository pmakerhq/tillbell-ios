name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      # swift build covers the StoreKit logic on macOS; the bridge component builds for iOS only.
      - run: xcodebuild -scheme Tillbell -destination 'generic/platform=iOS Simulator' build
      # The example app links the package like a host app would. Its StoreKit integration tests
      # are compiled here; they run on an iOS 27 simulator (see the README).
      - run: xcodebuild -project Example/TillbellExample.xcodeproj -scheme TillbellExample -destination 'generic/platform=iOS Simulator' build-for-testing
